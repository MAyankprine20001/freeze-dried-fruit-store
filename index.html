<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon_32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon_64.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Dry Factory | Freeze-Dried Fruit Snacks, Smoothies & Chocolates</title>

    <!-- SEO Meta Tags (per-page values are set at runtime by src/utils/seo.ts) -->
    <meta
      name="description"
      content="Freeze-dried fruit snacks, SipReal smoothie premixes and Freeze Fusion fruit chocolates from The Dry Factory. Made in India. Shop online."
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#213B14" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://thedryfactory.com/" />
    <meta property="og:title" content="The Dry Factory | Freeze-Dried Fruit Snacks, Smoothies & Chocolates" />
    <meta
      property="og:description"
      content="Freeze-dried fruit snacks, SipReal smoothie premixes and Freeze Fusion fruit chocolates from The Dry Factory. Made in India."
    />
    <meta property="og:image" content="https://thedryfactory.com/logo.png" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:site_name" content="The Dry Factory" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="The Dry Factory | Freeze-Dried Fruit Snacks, Smoothies & Chocolates" />
    <meta
      name="twitter:description"
      content="Freeze-dried fruit snacks, SipReal smoothie premixes and Freeze Fusion fruit chocolates from The Dry Factory. Made in India."
    />
    <meta name="twitter:image" content="https://thedryfactory.com/logo.png" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://thedryfactory.com/#organization",
            "name": "The Dry Factory",
            "url": "https://thedryfactory.com/",
            "logo": "https://thedryfactory.com/logo.png",
            "sameAs": ["https://www.instagram.com/thedryfactoryofficial/"]
          },
          {
            "@type": "WebSite",
            "@id": "https://thedryfactory.com/#website",
            "name": "The Dry Factory",
            "url": "https://thedryfactory.com/",
            "publisher": { "@id": "https://thedryfactory.com/#organization" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
